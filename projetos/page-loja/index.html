                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                            <div className="space-y-3 md:col-span-1">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold">
                                        <Icons.ShoppingBag className="w-4 h-4" />
                                    </div>
                                    <span className="text-lg font-black text-white">Bazar<span className="text-orange-500">Centro</span></span>
                                </div>
                                <p className="text-xs text-slate-400 font-body leading-relaxed">
                                    Tradição e variedade real no centro comercial. Tudo o que você precisa para utilidades, ferramentas, escritório e decoração com preço justo.
                                </p>
                            </div>

                            <div className="space-y-2">
                                <h5 className="font-bold text-white text-sm">Departamentos</h5>
                                <ul className="space-y-1.5 text-xs">
                                    <li><button onClick={() => { setDepartamentoAtivo("Utilidades"); window.scrollTo({ top: 700, behavior: 'smooth' }); }} className="hover:text-white transition">Utilidades Domésticas</button></li>
                                    <li><button onClick={() => { setDepartamentoAtivo("Eletrônicos"); window.scrollTo({ top: 700, behavior: 'smooth' }); }} className="hover:text-white transition">Eletrônicos & Ferramentas</button></li>
                                    <li><button onClick={() => { setDepartamentoAtivo("Papelaria"); window.scrollTo({ top: 700, behavior: 'smooth' }); }} className="hover:text-white transition">Papelaria & Escritório</button></li>
                                    <li><button onClick={() => { setDepartamentoAtivo("Decoração"); window.scrollTo({ top: 700, behavior: 'smooth' }); }} className="hover:text-white transition">Decoração & Lar</button></li>
                                </ul>
                            </div>

                            <div className="space-y-2">
                                <h5 className="font-bold text-white text-sm">Atendimento & Endereço</h5>
                                <p className="text-xs leading-relaxed text-slate-300">
                                    {ENDERECO_LOJA}<br />
                                    WhatsApp: {WHATSAPP_FORMATADO}<br />
                                    Seg - Sex: 08h às 19h | Sáb: 08h30 às 18h
                                </p>
                            </div>

                            <div className="space-y-2">
                                <h5 className="font-bold text-white text-sm">Formas de Pagamento</h5>
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    PIX com desconto imediato, Cartões de Crédito em até 6x sem juros, Débito e Dinheiro na retirada ou entrega.
                                </p>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-3 text-slate-500 text-[11px]">
                            <p>© {new Date().getFullYear()} Bazar e Utilidades Centro. Todos os direitos reservados.</p>
                            <p>Desenvolvido por Felipe Junqueira Leite • Modelo de Alta Conversão</p>
                        </div>
                    </footer>

                    {/* MODAL DE DETALHES DO PRODUTO FLUIDO E MODERNO */}
                    {produtoSelecionado && (
                        <div 
                            className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fadeIn"
                            onClick={() => setProdutoSelecionado(null)}
                        >
                            <div 
                                className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar border border-slate-100 p-6 sm:p-8 relative"
                                onClick={(e) => e.stopPropagation()}
                            >
                                {/* Botão Fechar */}
                                <button
                                    onClick={() => setProdutoSelecionado(null)}
                                    className="absolute top-5 right-5 p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 transition"
                                    aria-label="Fechar modal"
                                >
                                    <Icons.X className="w-5 h-5" />
                                </button>

                                <div className="grid sm:grid-cols-2 gap-6 items-start">
                                    {/* Imagem do Produto no Modal */}
                                    <div className="relative aspect-square rounded-2xl overflow-hidden bg-slate-100 border border-slate-200">
                                        <img
                                            src={produtoSelecionado.imagem}
                                            alt={produtoSelecionado.nome}
                                            className="w-full h-full object-cover"
                                        />
                                        <div className="absolute top-3 left-3 bg-red-600 text-white font-black text-xs px-2.5 py-1 rounded-xl shadow">
                                            {produtoSelecionado.selo}
                                        </div>
                                    </div>

                                    {/* Informações Completas */}
                                    <div className="space-y-4">
                                        <div>
                                            <span className="text-[10px] font-bold text-blue-600 uppercase tracking-widest bg-blue-50 px-2 py-0.5 rounded">
                                                {produtoSelecionado.departamento}
                                            </span>
                                            <h3 className="text-xl font-black text-slate-900 mt-1 leading-snug">
                                                {produtoSelecionado.nome}
                                            </h3>
                                            <div className="flex items-center gap-1.5 text-xs text-amber-500 mt-1">
                                                <Icons.Star className="w-3.5 h-3.5 fill-current" />
                                                <span className="font-bold text-slate-800">{produtoSelecionado.avaliacao}</span>
                                                <span className="text-slate-400">({produtoSelecionado.avaliacoesQtd} clientes satisfeitos)</span>
                                            </div>
                                        </div>

                                        <p className="text-slate-600 text-xs font-body leading-relaxed">
                                            {produtoSelecionado.descricao}
                                        </p>

                                        {/* Especificações Técnicas */}
                                        <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 space-y-1.5">
                                            <h5 className="font-bold text-xs text-slate-800 uppercase tracking-wider">O que acompanha:</h5>
                                            <ul className="text-xs text-slate-600 space-y-1 font-body">
                                                {produtoSelecionado.especificacoes.map((item, idx) => (
                                                    <li key={idx} className="flex items-start gap-1.5">
                                                        <Icons.CheckCircle className="w-3.5 h-3.5 text-emerald-500 shrink-0 mt-0.5" />
                                                        <span>{item}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>

                                        {/* Preço e Quantidade */}
                                        <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                                            <div>
                                                <span className="text-xs text-slate-400 line-through">
                                                    De R$ {produtoSelecionado.precoOriginal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                </span>
                                                <div className="text-2xl font-black text-slate-900">
                                                    R$ {produtoSelecionado.precoPromocional.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                </div>
                                            </div>

                                            {/* Seletor de Quantidade */}
                                            <div className="flex items-center border border-slate-200 rounded-xl bg-slate-50">
                                                <button
                                                    onClick={() => setQuantidadeModal(q => Math.max(1, q - 1))}
                                                    className="px-3 py-1.5 text-slate-600 hover:text-slate-900 font-bold"
                                                >
                                                    -
                                                </button>
                                                <span className="px-3 text-sm font-bold text-slate-800">{quantidadeModal}</span>
                                                <button
                                                    onClick={() => setQuantidadeModal(q => q + 1)}
                                                    className="px-3 py-1.5 text-slate-600 hover:text-slate-900 font-bold"
                                                >
                                                    +
                                                </button>
                                            </div>
                                        </div>

                                        {/* Botões do Modal */}
                                        <div className="grid grid-cols-2 gap-2 pt-2">
                                            <button
                                                onClick={() => {
                                                    adicionarASacola(produtoSelecionado, quantidadeModal);
                                                    setProdutoSelecionado(null);
                                                }}
                                                className="py-3 rounded-xl border border-slate-300 hover:bg-slate-100 font-bold text-xs text-slate-700 transition"
                                            >
                                                + Adicionar à Sacola
                                            </button>

                                            <button
                                                onClick={() => {
                                                    pedirProdutoWhatsApp(produtoSelecionado, quantidadeModal);
                                                    setProdutoSelecionado(null);
                                                }}
                                                className="py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 font-black text-xs text-white shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-1.5 transition"
                                            >
                                                <Icons.WhatsApp className="w-4 h-4 fill-white" />
                                                Pedir no WhatsApp
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DRAWER / SACOLA DE COMPRAS LATERAL */}
                    {sacolaAberta && (
                        <div 
                            className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex justify-end"
                            onClick={() => setSacolaAberta(false)}
                        >
                            <div 
                                className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between p-6 animate-slideLeft"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="space-y-4">
                                    <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                                        <div className="flex items-center gap-2">
                                            <Icons.ShoppingBag className="w-5 h-5 text-blue-600" />
                                            <h4 className="font-black text-lg text-slate-900">Minha Sacola de Ofertas</h4>
                                        </div>
                                        <button
                                            onClick={() => setSacolaAberta(false)}
                                            className="p-1.5 rounded-xl hover:bg-slate-100 text-slate-400 hover:text-slate-600"
                                        >
                                            <Icons.X className="w-5 h-5" />
                                        </button>
                                    </div>

                                    {/* Lista de Itens na Sacola */}
                                    <div className="overflow-y-auto max-h-[60vh] space-y-3 custom-scrollbar pr-1">
                                        {sacola.length === 0 ? (
                                            <div className="py-12 text-center text-slate-400 space-y-3">
                                                <Icons.ShoppingBag className="w-12 h-12 mx-auto text-slate-300 stroke-[1.5]" />
                                                <p className="text-sm font-semibold">Sua sacola está vazia.</p>
                                                <p className="text-xs text-slate-400">Navegue pelas promoções e adicione os itens que desejar!</p>
                                            </div>
                                        ) : (
                                            sacola.map((item) => (
                                                <div key={item.id} className="flex items-center gap-3 p-3 rounded-2xl border border-slate-100 bg-slate-50/70">
                                                    <img src={item.imagem} alt={item.nome} className="w-14 h-14 rounded-xl object-cover shrink-0" />
                                                    <div className="flex-1 min-w-0">
                                                        <h5 className="font-bold text-xs text-slate-800 truncate">{item.nome}</h5>
                                                        <p className="text-xs font-black text-emerald-600 mt-0.5">
                                                            R$ {(item.precoPromocional * item.quantidade).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                        </p>
                                                        <div className="flex items-center gap-2 mt-1.5">
                                                            <div className="flex items-center border border-slate-200 rounded-lg bg-white text-xs">
                                                                <button onClick={() => alterarQuantidadeSacola(item.id, -1)} className="px-2 py-0.5 text-slate-500 font-bold">-</button>
                                                                <span className="px-2 font-bold text-slate-700">{item.quantidade}</span>
                                                                <button onClick={() => alterarQuantidadeSacola(item.id, 1)} className="px-2 py-0.5 text-slate-500 font-bold">+</button>
                                                            </div>
                                                            <button 
                                                                onClick={() => removerDaSacola(item.id)}
                                                                className="text-[10px] text-red-500 hover:underline font-semibold ml-auto"
                                                            >
                                                                Remover
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                {/* Resumo e Checkout pelo WhatsApp */}
                                <div className="pt-4 border-t border-slate-100 space-y-3">
                                    <div className="flex justify-between items-center text-sm font-semibold">
                                        <span className="text-slate-500">Subtotal Promocional:</span>
                                        <span className="text-xl font-black text-slate-900">
                                            R$ {totalSacola.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-slate-400">
                                        * Validação de estoque e cálculo de entrega feitos diretamente pelo WhatsApp.
                                    </p>
                                    <button
                                        disabled={sacola.length === 0}
                                        onClick={finalizarPedidoSacolaWhatsApp}
                                        className="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 disabled:pointer-events-none text-white font-black text-sm flex items-center justify-center gap-2 shadow-xl shadow-emerald-500/25 transition active:scale-95"
                                    >
                                        <Icons.WhatsApp className="w-5 h-5 fill-white" />
                                        Enviar Pedido para o WhatsApp
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTÃO FLUTUANTE DO WHATSAPP COM RADAR & TOOLTIP */}
                    <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-2">
                        <div className="hidden sm:flex items-center gap-2 bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow-xl border border-slate-700">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                            Atendimento online no WhatsApp
                        </div>
                        <button
                            onClick={() => abrirWhatsApp("Olá! Vi a vitrine do Bazar Centro e gostaria de atendimento.")}
                            className="w-14 h-14 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-2xl shadow-emerald-500/40 hover:scale-110 active:scale-95 transition-all duration-300 group"
                            aria-label="Atendimento rápido pelo WhatsApp"
                        >
                            <Icons.WhatsApp className="w-7 h-7 fill-white group-hover:rotate-12 transition duration-300" />
                        </button>
                    </div>

                    {/* CONTAINER DE TOASTS ELEGANTES (SEM NENHUM ALERT) */}
                    <div className="fixed bottom-6 left-6 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
                        {toasts.map((toast) => (
                            <div
                                key={toast.id}
                                className={`pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold transition-all transform translate-y-0 ${
                                    toast.tipo === "sucesso"
                                        ? "bg-slate-900 text-white border border-emerald-500/40"
                                        : "bg-slate-900 text-white border border-blue-500/40"
                                }`}
                            >
                                <Icons.CheckCircle className={`w-4 h-4 shrink-0 ${toast.tipo === 'sucesso' ? 'text-emerald-400' : 'text-blue-400'}`} />
                                <span className="flex-1 font-body">{toast.mensagem}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
